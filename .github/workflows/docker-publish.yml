name: Docker image

# Publishes ghcr.io/<owner>/fieldseal-suite so `docker run` works with no clone
# and no build. Built from the same tree the gates job just verified.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          # Apple-silicon laptops and plain linux/amd64 servers must both work.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pull the published image back and smoke-test it
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}:latest"
          docker pull "$IMAGE"
          docker run -d --name fieldseal-smoke -p 8123:8123 "$IMAGE"
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8123/ >/dev/null 2>&1 && break
            sleep 1
          done
          fail=0
          for p in pwa/index.html pwa/capture.html pwa/cases.html pwa/sign.html pwa/custody.html; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8123/$p")
            printf '%-26s %s\n' "/$p" "$code"
            [ "$code" = "200" ] || fail=1
          done
          docker rm -f fieldseal-smoke
          test "$fail" = "0"
